<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a7060" id="theme-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MBCT">
<link rel="manifest" href="manifest.json">
<title>MBCT: Distinctive Features</title>
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f6f1;
  --bg-card: #ffffff;
  --bg-elevated: #f0ede6;
  --text: #2d2926;
  --text-soft: #6b6560;
  --accent: #4a7060;
  --accent-light: #e4eeea;
  --part1: #4a7060;
  --part1-bg: #e4eeea;
  --part2: #5a5a8a;
  --part2-bg: #eaeaf4;
  --border: #e0dcd4;
  --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --radius: 14px;
  --radius-sm: 8px;
  --font-body: Georgia, 'Times New Roman', serif;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #1c1917;
  --bg-card: #252220;
  --bg-elevated: #2a2724;
  --text: #e8e0d4;
  --text-soft: #8a8278;
  --accent: #6a9a80;
  --accent-light: #1e3028;
  --part1: #6a9a80;
  --part1-bg: #1e3028;
  --part2: #8080b0;
  --part2-bg: #22223a;
  --border: #3a3630;
  --shadow-card: 0 1px 3px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.15);
}

html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  min-height: 100dvh;
  transition: background .25s, color .25s;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 640px; margin: 0 auto; }

/* ── Header ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  transition: background .25s, border-color .25s;
}
.app-header h1 {
  font-size: 17px; font-weight: 600; color: var(--text);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-back {
  display: none; align-items: center; gap: 5px;
  font-size: 15px; color: var(--accent);
  background: none; border: none; cursor: pointer; padding: 4px 0;
  font-family: var(--font-ui); flex-shrink: 0;
}
.header-back.visible { display: flex; }
.btn-icon {
  background: none; border: none; cursor: pointer;
  color: var(--text-soft); padding: 6px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: color .2s, background .2s;
}
.btn-icon:hover { color: var(--text); background: var(--bg-elevated); }

/* ── Shared view scroll container ── */
.view { overflow-y: auto; height: calc(100dvh - 53px); }

/* ── Reading Progress ── */
.reading-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent);
  transform-origin: left; transform: scaleX(0);
  transition: transform .1s linear;
  z-index: 200; pointer-events: none;
}

/* ══════════════════════════════════════
   TOC VIEW
══════════════════════════════════════ */
#view-toc { padding-bottom: 40px; }

.toc-hero {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}
.toc-hero .book-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.toc-hero .book-author { font-size: 13px; color: var(--text-soft); }

/* ── Key Teachings section ── */
.section-header {
  padding: 20px 16px 10px;
  display: flex; align-items: baseline; gap: 8px;
}
.section-header h2 { font-size: 18px; font-weight: 700; }
.section-header span { font-size: 12px; color: var(--text-soft); }

.teachings-group {
  padding: 0 16px;
  margin-bottom: 16px;
}
.teachings-group-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-soft);
  padding: 10px 0 10px;
  border-top: 1px solid var(--border);
}
.teachings-group:first-child .teachings-group-label {
  border-top: none; padding-top: 0;
}

.teachings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.teachings-grid.single { grid-template-columns: 1fr; }

.teaching-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: background .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column; gap: 6px;
  position: relative;
}
.teaching-card:active { transform: scale(0.97); }

.teaching-tag {
  font-size: 10px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--accent);
}
.teaching-title {
  font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--text);
}
.teaching-arrow {
  position: absolute; right: 12px; bottom: 12px;
  color: var(--border);
}

/* ── All Features section (TOC) ── */
.toc-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 16px 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border-top: 1px solid var(--border);
  margin-top: 24px;
}
.toc-toggle h2 { font-size: 18px; font-weight: 700; }
.toc-toggle-icon {
  color: var(--text-soft); font-size: 13px;
  transition: transform .2s;
}
.toc-toggle-icon.open { transform: rotate(180deg); }

#toc-features { display: none; }
#toc-features.open { display: block; }

.part-section { padding: 0 16px; margin-bottom: 8px; }
.part-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-soft);
  padding: 8px 0 10px;
}

.feature-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 12px 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 32px 1fr 16px;
  gap: 10px;
  align-items: start;
  box-shadow: var(--shadow-card);
  transition: background .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.feature-card:active { transform: scale(0.985); }

.feature-num {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
}
.part-1 .feature-num { background: var(--part1-bg); color: var(--part1); }
.part-2 .feature-num { background: var(--part2-bg); color: var(--part2); }

.feature-info { min-width: 0; }
.feature-title { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--text); margin-bottom: 3px; }
.feature-preview {
  font-size: 12px; color: var(--text-soft); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-arrow { color: var(--border); margin-top: 2px; flex-shrink: 0; }

/* ══════════════════════════════════════
   TEACHING DETAIL VIEW
══════════════════════════════════════ */
#view-teaching { display: none; }

.teaching-hero {
  padding: 22px 16px 18px;
  border-bottom: 1px solid var(--border);
}
.teaching-source {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--accent);
  background: var(--accent-light); border-radius: 20px;
  padding: 3px 10px; margin-bottom: 10px;
  cursor: pointer;
}
.teaching-hero-title {
  font-size: 24px; font-weight: 700; line-height: 1.2;
  font-family: var(--font-body); color: var(--text);
}

.teaching-passage {
  padding: 20px 16px;
  font-family: var(--font-body);
  font-size: 16.5px; line-height: 1.78; color: var(--text);
}
.teaching-passage p { margin-bottom: 1.1em; }

.expand-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px 24px;
}
.expand-bar::before, .expand-bar::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.expand-btn {
  font-size: 13px; font-weight: 600; color: var(--accent);
  background: var(--accent-light); border: none; cursor: pointer;
  padding: 6px 16px; border-radius: 20px;
  font-family: var(--font-ui); white-space: nowrap;
  transition: background .15s;
}
.expand-btn:hover { background: var(--border); }

.teaching-more { display: none; }
.teaching-more.open {
  display: block;
  padding: 0 16px;
  font-family: var(--font-body);
  font-size: 16.5px; line-height: 1.78; color: var(--text);
}
.teaching-more.open p { margin-bottom: 1.1em; }
.teaching-more.open h3 {
  font-family: var(--font-ui); font-size: 16px; font-weight: 700;
  color: var(--text); margin: 1.8em 0 .6em; line-height: 1.3;
}

.full-chapter-link {
  display: flex; align-items: center; justify-content: space-between;
  margin: 24px 16px 60px;
  padding: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  box-shadow: var(--shadow-card);
  -webkit-tap-highlight-color: transparent;
}
.full-chapter-link-label { font-size: 13px; color: var(--text-soft); margin-bottom: 2px; }
.full-chapter-link-title { font-size: 15px; font-weight: 600; color: var(--text); }

/* ══════════════════════════════════════
   CHAPTER VIEW
══════════════════════════════════════ */
#view-chapter { display: none; }

.chapter-hero {
  padding: 22px 16px 18px;
  border-bottom: 1px solid var(--border);
}
.chapter-part-tag {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; padding: 3px 10px;
  border-radius: 20px; margin-bottom: 10px;
}
.chapter-part-tag.theory  { background: var(--part1-bg); color: var(--part1); }
.chapter-part-tag.practice { background: var(--part2-bg); color: var(--part2); }

.chapter-title {
  font-size: 22px; font-weight: 700; line-height: 1.25;
  color: var(--text); font-family: var(--font-body);
}

.chapter-body {
  padding: 20px 16px 60px;
  font-family: var(--font-body);
  font-size: 16.5px; line-height: 1.78; color: var(--text);
}
.chapter-body p { margin-bottom: 1.1em; }
.chapter-body h3 {
  font-family: var(--font-ui);
  font-size: 16px; font-weight: 700;
  color: var(--text); margin: 1.8em 0 .6em; line-height: 1.3;
}
.chapter-body blockquote {
  border-left: 3px solid var(--border);
  padding: 2px 0 2px 16px; margin: 1.2em 0;
  color: var(--text-soft); font-style: italic;
}
.chapter-body ul, .chapter-body ol { padding-left: 1.4em; margin-bottom: 1.1em; }
.chapter-body li { margin-bottom: .5em; line-height: 1.7; }
</style>

<script>
/* ═══ KEY TEACHINGS DATA ═══ */
const KEY_TEACHINGS = [
  {
    id: 'mindfulness',
    title: 'What mindfulness is',
    chapterId: 1,

    paragraphs: 1
  },
  {
    id: 'automatic-pilot',
    title: 'Automatic pilot',

  },
  {

    title: 'Doing mode',
    chapterId: 5,
    startPhrase: 'An essential premise of MBCT is that the mind has two broad modes',
    paragraphs: 2
  },
  {
    id: 'being-mode',
    title: 'Being mode',
    chapterId: 9,
    startPhrase: 'As described in Point 5, a central premise of MBCT is that the mind operates in different modes',
    paragraphs: 1
  },
  {
    id: 'rumination',
    title: 'The trap of rumination',
    chapterId: 6,
    startPhrase: 'Rumination is an attempt to address difficult emotions through a process of analysis and problem solving',
    paragraphs: 1
  },
  {

    paragraphs: 1
  },
  {
    id: 'acceptance',
    title: 'Acceptance',
    chapterId: 11,
    startPhrase: 'Acceptance can be confused with resignation and giving up',
    paragraphs: 2
  },
  {
    id: 'decentring',
    title: 'Thoughts are not facts',
    chapterId: 12,
    startPhrase: 'At the heart of mindfulness practice is a paradox',
    paragraphs: 1
  },
  {
    id: 'body',
    title: 'The body as doorway',
    chapterId: 10,
    startPhrase: 'Training in mindfulness places a great deal of emphasis on learning to be with direct experience as it arises in the body',
    paragraphs: 2
  },
  {
    id: 'awareness',
    title: 'Awareness as container',
    chapterId: 13,
    startPhrase: 'It can feel tremendously reassuring to hear that awareness can contain any experience that emerges',
    paragraphs: 2
  },
];

const TEACHING_GROUPS = [
  {
    label: 'The foundation',
    ids: ['mindfulness']
  },
  {
    label: 'How suffering arises',
    ids: ['automatic-pilot', 'doing-mode', 'rumination', 'avoidance']
  },
  {
    label: 'The way through',
    ids: ['being-mode', 'body', 'acceptance', 'decentring', 'awareness']
  },
];

/* ═══ THEME ═══ */
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
let isDark = localStorage.getItem('theme') === 'dark' ||
             (!localStorage.getItem('theme') && prefersDark.matches);

function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-meta').content = isDark ? '#1c1917' : '#4a7060';
  const icon = document.getElementById('theme-icon');
  icon.innerHTML = isDark
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="none"/>'
    : `<circle cx="12" cy="12" r="4"/>
       <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
       <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
       <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
       <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>`;
}

function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  applyTheme();
}
applyTheme();

/* ═══ TEXT UTILITIES ═══ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderParas(text) {
  const paras = text.split('\n\n');
  let html = '';
  for (const raw of paras) {
    const trimmed = raw.trim();
    if (!trimmed) continue;
    const lines = trimmed.split('\n').map(l => l.trim()).filter(Boolean);
    const joined = lines.join(' ');

    // Bullet list
    if (raw.includes('\n·') || raw.startsWith('·')) {
      const items = raw.split(/\n?·/).filter(s => s.trim());
      html += '<ul>' + items.map(s => `<li>${escHtml(s.replace(/\n/g,' ').trim())}</li>`).join('') + '</ul>';
      continue;
    }

    // Short parenthetical citation or footnote reference
    if (lines.length === 1 && joined.length < 100 && (/^\(/.test(joined) || /^\d+ /.test(joined))) {
      html += `<p style="color:var(--text-soft);font-size:.85em;margin-top:-.5em">${escHtml(joined)}</p>`;
      continue;
    }

    // Paragraph with an inline section heading on the first line
    // (first line: short, no sentence-ending punct, starts with capital; body follows)
    const firstLine = lines[0];
    const bodyLines = lines.slice(1);
    const firstLineIsHeading = firstLine.length < 80 &&
      !/[.!?]$/.test(firstLine) && /^[A-Z"']/.test(firstLine) &&
      !/^[·\d]/.test(firstLine) && bodyLines.length >= 1 &&
      bodyLines.join(' ').length > 40;
    if (firstLineIsHeading) {
      html += `<h3>${escHtml(firstLine)}</h3><p>${escHtml(bodyLines.join(' '))}</p>`;
      continue;
    }

    // Standalone section heading
    const isHeader = joined.length < 90 && lines.length <= 2 &&
      !/[.!?)]$/.test(joined) && /^[A-Z"']/.test(joined) &&
      !/^[·\d]/.test(joined[0]);
    if (isHeader) { html += `<h3>${escHtml(joined)}</h3>`; continue; }

    html += `<p>${escHtml(joined)}</p>`;
  }
  return html;
}

/* ═══ PASSAGE EXTRACTION ═══ */
function extractPassage(chapterId, startPhrase, count) {
  const ch = CHAPTERS.find(c => c.id === chapterId);
  if (!ch) return { key: '', more: '' };
  const paras = ch.body.split('\n\n').filter(p => p.trim());

  // Normalize newlines to spaces for searching (PDF text has hard-wrapped lines)
  const phraseLower = startPhrase.toLowerCase();
  let idx = paras.findIndex(p => p.toLowerCase().replace(/\n/g,' ').includes(phraseLower));
  if (idx === -1) idx = 0;

  // Trim the starting paragraph to begin exactly at the phrase
  let firstPara = paras[idx];
  const norm = firstPara.toLowerCase().replace(/\n/g,' ');
  const phrasePos = norm.indexOf(phraseLower);
  if (phrasePos > 0) firstPara = firstPara.slice(phrasePos);

  const all = [firstPara, ...paras.slice(idx + 1)];
  return {
    key: all.slice(0, count).join('\n\n'),
    more: all.slice(count, count + 8).join('\n\n')
  };
}

/* ═══ NAVIGATION STATE ═══ */
let navStack = []; // 'toc' | 'teaching:id' | 'chapter:id'
let currentTeachingChapterId = null;
let expanded = false;

function showView(id) {
  ['view-toc','view-teaching','view-chapter'].forEach(v => {
    document.getElementById(v).style.display = v === id ? 'block' : 'none';
  });
  document.getElementById('reading-progress').style.transform = 'scaleX(0)';
}

function goBack() {
  navStack.pop();
  const prev = navStack[navStack.length - 1] || 'toc';
  if (prev === 'toc') { renderHome(); return; }
  if (prev.startsWith('teaching:')) { showTeaching(prev.split(':')[1], false); return; }
  if (prev.startsWith('chapter:')) { showChapter(parseInt(prev.split(':')[1]), false); return; }
}

/* ═══ HOME / TOC ═══ */
function renderHome() {
  navStack = ['toc'];
  document.getElementById('btn-back').classList.remove('visible');
  document.getElementById('header-title').textContent = 'MBCT';
  showView('view-toc');
  document.getElementById('view-toc').scrollTop = 0;
}

function toggleTOC() {
  const el = document.getElementById('toc-features');
  const icon = document.getElementById('toc-icon');
  const toggle = document.getElementById('toc-toggle');
  const isOpen = el.classList.toggle('open');
  icon.classList.toggle('open', isOpen);
  toggle.setAttribute('aria-expanded', isOpen);
}

/* ═══ TEACHING CARDS ═══ */
function makeTeachingCard(t) {
  const card = document.createElement('div');
  card.className = 'teaching-card';
  card.setAttribute('role','button');
  card.setAttribute('tabindex','0');
  card.onclick = () => showTeaching(t.id);
  card.onkeydown = e => { if (e.key==='Enter'||e.key===' ') showTeaching(t.id); };
  card.innerHTML = `
    <div class="teaching-tag">Feature ${t.chapterId}</div>
    <div class="teaching-title">${escHtml(t.title)}</div>
    <svg class="teaching-arrow" width="7" height="11" viewBox="0 0 7 11" fill="none">
      <path d="M1 1l4.5 4.5L1 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  return card;
}

function renderTeachings() {
  const container = document.getElementById('teachings-container');
  TEACHING_GROUPS.forEach(group => {
    const section = document.createElement('div');
    section.className = 'teachings-group';

    const label = document.createElement('div');
    label.className = 'teachings-group-label';
    label.textContent = group.label;
    section.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'teachings-grid' + (group.ids.length === 1 ? ' single' : '');
    group.ids.forEach(id => {
      const t = KEY_TEACHINGS.find(x => x.id === id);
      if (t) grid.appendChild(makeTeachingCard(t));
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
}

/* ═══ FEATURE CARDS (TOC) ═══ */
function renderFeatureCards() {
  const p1 = document.getElementById('part1-section');
  const p2 = document.getElementById('part2-section');
  CHAPTERS.forEach(ch => {
    const card = document.createElement('div');
    card.className = `feature-card part-${ch.part}`;
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');
    card.onclick = () => showChapter(ch.id);
    card.onkeydown = e => { if (e.key==='Enter'||e.key===' ') showChapter(ch.id); };
    let preview = ch.preview.replace(/^\s*\d{1,2}\s*\)\s*/,'').replace(/\n/g,' ').trim().slice(0,140);
    card.innerHTML = `
      <div class="feature-num">${ch.id}</div>
      <div class="feature-info">
        <div class="feature-title">${escHtml(ch.title)}</div>
        <div class="feature-preview">${escHtml(preview)}</div>
      </div>
      <svg class="card-arrow" width="7" height="12" viewBox="0 0 7 12" fill="none">
        <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    (ch.part === 1 ? p1 : p2).appendChild(card);
  });
}

/* ═══ SHOW TEACHING ═══ */
function showTeaching(id, push = true) {
  const t = KEY_TEACHINGS.find(x => x.id === id);
  if (!t) return;
  const ch = CHAPTERS.find(c => c.id === t.chapterId);
  if (!ch) return;

  if (push) navStack.push(`teaching:${id}`);
  currentTeachingChapterId = t.chapterId;
  expanded = false;

  document.getElementById('btn-back').classList.add('visible');
  document.getElementById('back-label').textContent = navStack.length > 2 ? 'Back' : 'Home';
  document.getElementById('header-title').textContent = t.title;

  document.getElementById('teaching-source-label').textContent = `Feature ${t.chapterId}`;
  document.getElementById('teaching-hero-title').textContent = t.title;
  document.getElementById('full-chapter-link-title').textContent = ch.title;

  const { key, more } = extractPassage(t.chapterId, t.startPhrase, t.paragraphs);
  document.getElementById('teaching-passage').innerHTML = renderParas(key);

  const moreEl = document.getElementById('teaching-more');
  moreEl.innerHTML = renderParas(more);
  moreEl.classList.remove('open');
  document.getElementById('expand-btn').textContent = 'Read more';

  showView('view-teaching');
  document.getElementById('view-teaching').scrollTop = 0;
}

function toggleExpand() {
  expanded = !expanded;
  document.getElementById('teaching-more').classList.toggle('open', expanded);
  document.getElementById('expand-btn').textContent = expanded ? 'Show less' : 'Read more';
}

function goToChapterFromTeaching() {
  if (currentTeachingChapterId) showChapter(currentTeachingChapterId);
}

/* ═══ SHOW CHAPTER ═══ */
function showChapter(id, push = true) {
  const ch = CHAPTERS.find(c => c.id === id);
  if (!ch) return;

  if (push) navStack.push(`chapter:${id}`);
  document.getElementById('btn-back').classList.add('visible');
  document.getElementById('back-label').textContent = navStack.length > 2 ? 'Back' : 'Home';
  document.getElementById('header-title').textContent = `Feature ${ch.id}`;

  const tag = document.getElementById('chapter-tag');
  tag.textContent = ch.part === 1 ? 'Theory' : 'Practice';
  tag.className = 'chapter-part-tag ' + (ch.part === 1 ? 'theory' : 'practice');
  document.getElementById('chapter-title').textContent = ch.title;

  // Strip title text from body start then render
  let body = ch.body;
  const titleAlpha = ch.title.toLowerCase().replace(/[^a-z]/g,'');
  const bodyAlpha  = body.toLowerCase().replace(/[^a-z]/g,'');
  if (bodyAlpha.startsWith(titleAlpha.slice(0, Math.min(20, titleAlpha.length)))) {
    let matched = 0, i = 0;
    for (; i < body.length && matched < titleAlpha.length; i++) {
      if (/[a-zA-Z]/.test(body[i])) matched++;
    }
    body = body.slice(i).trim();
  }
  document.getElementById('chapter-body').innerHTML = renderParas(body);

  showView('view-chapter');
  const cv = document.getElementById('view-chapter');
  cv.scrollTop = 0;
  cv.onscroll = () => {
    const p = cv.scrollTop / (cv.scrollHeight - cv.clientHeight) || 0;
    document.getElementById('reading-progress').style.transform = `scaleX(${p})`;
  };
}

/* ═══ BROWSER BACK ═══ */
window.addEventListener('popstate', e => {
  if (navStack.length > 1) goBack();
  else renderHome();
});

/* ═══ INIT ═══ */
renderTeachings();
renderFeatureCards();
renderHome();

// Handle direct URL hash
const m = location.hash.match(/^#feature-(\d+)$/);
if (m) showChapter(parseInt(m[1]));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
