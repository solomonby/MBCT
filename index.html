<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a7060" id="theme-meta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MBCT">
<link rel="manifest" href="manifest.json">
<title>MBCT: Distinctive Features</title>
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f6f1;
  --bg-card: #ffffff;
  --bg-elevated: #f0ede6;
  --text: #2d2926;
  --text-soft: #6b6560;
  --accent: #4a7060;
  --accent-light: #e4eeea;
  --part1: #4a7060;
  --part1-bg: #e4eeea;
  --part2: #5a5a8a;
  --part2-bg: #eaeaf4;
  --border: #e0dcd4;
  --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --radius: 14px;
  --radius-sm: 8px;
  --font-body: Georgia, 'Times New Roman', serif;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #1c1917;
  --bg-card: #252220;
  --bg-elevated: #2a2724;
  --text: #e8e0d4;
  --text-soft: #8a8278;
  --accent: #6a9a80;
  --accent-light: #1e3028;
  --part1: #6a9a80;
  --part1-bg: #1e3028;
  --part2: #8080b0;
  --part2-bg: #22223a;
  --border: #3a3630;
  --shadow-card: 0 1px 3px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.15);
}

html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  min-height: 100dvh;
  transition: background .25s, color .25s;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 640px; margin: 0 auto; }

/* ── Header ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  transition: background .25s, border-color .25s;
}
.app-header h1 {
  font-size: 17px; font-weight: 600; color: var(--text);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-back {
  display: none; align-items: center; gap: 5px;
  font-size: 15px; color: var(--accent);
  background: none; border: none; cursor: pointer; padding: 4px 0;
  font-family: var(--font-ui); flex-shrink: 0;
}
.header-back.visible { display: flex; }
.btn-icon {
  background: none; border: none; cursor: pointer;
  color: var(--text-soft); padding: 6px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: color .2s, background .2s;
}
.btn-icon:hover { color: var(--text); background: var(--bg-elevated); }

/* ── Shared view scroll container ── */
.view { overflow-y: auto; height: calc(100dvh - 53px); }

/* ── Reading Progress ── */
.reading-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent);
  transform-origin: left; transform: scaleX(0);
  transition: transform .1s linear;
  z-index: 200; pointer-events: none;
}

/* ══════════════════════════════════════
   TOC VIEW
══════════════════════════════════════ */
#view-toc { padding-bottom: 40px; }

.toc-hero {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}
.toc-hero .book-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.toc-hero .book-author { font-size: 13px; color: var(--text-soft); }

/* ── Narrative section ── */
.narrative-section {
  padding: 22px 16px 20px;
  border-bottom: 1px solid var(--border);
}
.section-eyebrow {
  display: block;
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-soft); margin-bottom: 16px;
}
.narrative-sentence {
  font-family: var(--font-body); font-size: 15px; line-height: 1.8;
  color: var(--text); padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.narrative-sentence:first-of-type { padding-top: 0; }
.narrative-sentence:last-of-type { border-bottom: none; padding-bottom: 0; }

/* ── Action plan section ── */
.action-section { padding: 22px 16px 12px; }
.action-step {
  display: flex; gap: 14px; margin-bottom: 26px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.action-step:last-child { margin-bottom: 0; }
.action-step:active .action-content { opacity: 0.6; }
.action-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px;
}
.action-content { flex: 1; min-width: 0; }
.action-title {
  font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.3; margin-bottom: 8px;
}
.action-quote {
  font-family: var(--font-body); font-size: 14px; line-height: 1.72;
  color: var(--text-soft); font-style: italic; margin-bottom: 8px;
}
.action-more {
  font-size: 12px; font-weight: 600; color: var(--accent);
  display: inline-flex; align-items: center; gap: 3px;
}

/* ── All Features section (TOC) ── */
.toc-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 16px 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border-top: 1px solid var(--border);
  margin-top: 24px;
}
.toc-toggle h2 { font-size: 18px; font-weight: 700; }
.toc-toggle-icon {
  color: var(--text-soft); font-size: 13px;
  transition: transform .2s;
}
.toc-toggle-icon.open { transform: rotate(180deg); }

#toc-features { display: none; }
#toc-features.open { display: block; }

.part-section { padding: 0 16px; margin-bottom: 8px; }
.part-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-soft);
  padding: 8px 0 10px;
}

.feature-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px 14px 14px;
  margin-bottom: 8px;
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: background .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.feature-card:active { transform: scale(0.985); }
.feature-card-header {
  display: grid; grid-template-columns: 32px 1fr 16px;
  gap: 10px; align-items: center;
}

.feature-num {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
}
.part-1 .feature-num { background: var(--part1-bg); color: var(--part1); }
.part-2 .feature-num { background: var(--part2-bg); color: var(--part2); }

.feature-title { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--text); }
.card-arrow { color: var(--border); flex-shrink: 0; }

.feature-summary {
  padding-left: 42px; margin-top: 8px;
  font-family: var(--font-body); font-size: 13.5px;
  line-height: 1.72; color: var(--text-soft);
}
.feature-summary p { margin-bottom: 0.55em; }
.feature-summary p:last-child { margin-bottom: 0; }
.feature-summary ul { padding-left: 1.1em; margin-bottom: 0.55em; }
.feature-summary li { margin-bottom: 0.35em; line-height: 1.6; }

/* ══════════════════════════════════════
   TEACHING DETAIL VIEW
══════════════════════════════════════ */
#view-teaching { display: none; }

.teaching-hero {
  padding: 22px 16px 18px;
  border-bottom: 1px solid var(--border);
}
.teaching-source {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--accent);
  background: var(--accent-light); border-radius: 20px;
  padding: 3px 10px; margin-bottom: 10px;
  cursor: pointer;
}
.teaching-hero-title {
  font-size: 24px; font-weight: 700; line-height: 1.2;
  font-family: var(--font-body); color: var(--text);
}

.pull-quote-block {
  margin: 20px 16px 0;
  padding: 16px 18px;
  background: var(--bg-elevated);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: var(--font-body);
  font-size: 18px; line-height: 1.65;
  color: var(--text);
}

.teaching-passage {
  padding: 16px 16px 4px;
  font-family: var(--font-body);
  font-size: 16px; line-height: 1.78; color: var(--text);
}
.teaching-passage p { margin-bottom: 1em; }
.teaching-passage h3 {
  font-family: var(--font-ui); font-size: 15px; font-weight: 700;
  color: var(--text); margin: 1.4em 0 .5em; line-height: 1.3;
}

.expand-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px 24px;
}
.expand-bar::before, .expand-bar::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.expand-btn {
  font-size: 13px; font-weight: 600; color: var(--accent);
  background: var(--accent-light); border: none; cursor: pointer;
  padding: 6px 16px; border-radius: 20px;
  font-family: var(--font-ui); white-space: nowrap;
  transition: background .15s;
}
.expand-btn:hover { background: var(--border); }

.teaching-more { display: none; }
.teaching-more.open { display: block; }

/* Sentence-list layout used in both passage body and expanded section */
.insight-list { padding: 8px 16px 4px; }
.insight-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-soft);
  padding: 14px 0 4px;
}
.insight-item {
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-body);
  font-size: 16px; line-height: 1.7;
  color: var(--text);
}
.insight-item:last-child { border-bottom: none; }
.insight-item.dim { color: var(--text-soft); font-style: italic; font-size: 14px; }

.full-chapter-link {
  display: flex; align-items: center; justify-content: space-between;
  margin: 24px 16px 60px;
  padding: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  box-shadow: var(--shadow-card);
  -webkit-tap-highlight-color: transparent;
}
.full-chapter-link-label { font-size: 13px; color: var(--text-soft); margin-bottom: 2px; }
.full-chapter-link-title { font-size: 15px; font-weight: 600; color: var(--text); }

/* ══════════════════════════════════════
   CHAPTER VIEW
══════════════════════════════════════ */
#view-chapter { display: none; }

.chapter-hero {
  padding: 22px 16px 18px;
  border-bottom: 1px solid var(--border);
}
.chapter-part-tag {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; padding: 3px 10px;
  border-radius: 20px; margin-bottom: 10px;
}
.chapter-part-tag.theory  { background: var(--part1-bg); color: var(--part1); }
.chapter-part-tag.practice { background: var(--part2-bg); color: var(--part2); }

.chapter-title {
  font-size: 22px; font-weight: 700; line-height: 1.25;
  color: var(--text); font-family: var(--font-body);
}

.chapter-body {
  padding: 20px 16px 60px;
  font-family: var(--font-body);
  font-size: 16.5px; line-height: 1.78; color: var(--text);
}
.chapter-body p { margin-bottom: 1.1em; }
.chapter-body h3 {
  font-family: var(--font-ui);
  font-size: 16px; font-weight: 700;
  color: var(--text); margin: 1.8em 0 .6em; line-height: 1.3;
}
.chapter-body blockquote {
  border-left: 3px solid var(--border);
  padding: 2px 0 2px 16px; margin: 1.2em 0;
  color: var(--text-soft); font-style: italic;
}
.footnote-line {
  font-size: 0.82em; color: var(--text-soft);
  margin-top: 1.2em; padding-top: 0.6em;
  border-top: 1px solid var(--border);
}
.chapter-body ul, .chapter-body ol { padding-left: 1.4em; margin-bottom: 1.1em; }
.chapter-body li { margin-bottom: .5em; line-height: 1.7; }
</style>
</head>
<body>
<div class="reading-progress" id="reading-progress"></div>

<div id="app">

  <!-- Header -->
  <header class="app-header">
    <button class="header-back" id="btn-back" onclick="goBack()" aria-label="Back">
      <svg width="8" height="13" viewBox="0 0 8 13" fill="none">
        <path d="M7 1L1 6.5L7 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="back-label">Back</span>
    </button>
    <h1 id="header-title">MBCT</h1>
    <button class="btn-icon" id="btn-theme" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
        <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
      </svg>
    </button>
  </header>

  <!-- ═══ TOC VIEW ═══ -->
  <div id="view-toc" class="view">
    <div class="toc-hero">
      <div class="book-title">Mindfulness-Based Cognitive Therapy</div>
      <div class="book-author">Distinctive Features &nbsp;·&nbsp; Rebecca Crane</div>
    </div>

    <!-- Journey sections -->
    <div id="teachings-container"></div>

    <!-- All Chapters (collapsible) -->
    <div class="toc-toggle" onclick="toggleTOC()" role="button" aria-expanded="false" id="toc-toggle">
      <h2>All 30 Chapters</h2>
      <span class="toc-toggle-icon" id="toc-icon">&#9660;</span>
    </div>
    <div id="toc-features">
      <div class="part-section part-1" id="part1-section">
        <div class="part-label">Part 1 &mdash; Theory (Chapters 1–15)</div>
      </div>
      <div class="part-section part-2" id="part2-section">
        <div class="part-label">Part 2 &mdash; Practice (Chapters 16–30)</div>
      </div>
    </div>
  </div>

  <!-- ═══ TEACHING DETAIL VIEW ═══ -->
  <div id="view-teaching" class="view">
    <div class="teaching-hero">
      <div class="teaching-source" id="teaching-source-chip" onclick="goToChapterFromTeaching()">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><rect width="10" height="10" rx="2"/></svg>
        <span id="teaching-source-label">Chapter 1</span>
      </div>
      <div class="teaching-hero-title" id="teaching-hero-title"></div>
    </div>

    <div class="pull-quote-block" id="pull-quote"></div>
    <div class="teaching-passage" id="teaching-passage"></div>

    <div class="expand-bar">
      <button class="expand-btn" id="expand-btn" onclick="toggleExpand()">Read more</button>
    </div>

    <div class="teaching-more" id="teaching-more"></div>

    <div class="full-chapter-link" id="full-chapter-link" onclick="goToChapterFromTeaching()">
      <div>
        <div class="full-chapter-link-label">Read the full chapter</div>
        <div class="full-chapter-link-title" id="full-chapter-link-title"></div>
      </div>
      <svg width="7" height="12" viewBox="0 0 7 12" fill="none">
        <path d="M1 1l5 5-5 5" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ═══ CHAPTER VIEW ═══ -->
  <div id="view-chapter" class="view">
    <div class="chapter-hero">
      <div class="chapter-part-tag" id="chapter-tag">Theory</div>
      <h2 class="chapter-title" id="chapter-title"></h2>
    </div>
    <div class="chapter-body" id="chapter-body"></div>
  </div>

</div>

<script src="chapters.js"></script>
<script>
/* ═══ KEY TEACHINGS DATA ═══ */
const KEY_TEACHINGS = [
  {
    id: 'mindfulness',
    title: 'What mindfulness is',
    chapterId: 1,
    startPhrase: 'Mindfulness is the awareness that emerges when we pay attention',
    paragraphs: 1
  },
  {
    id: 'automatic-pilot',
    title: 'Automatic pilot',
    chapterId: 3,
    startPhrase: 'The development of mindful awareness in MBCT is initially focused on illuminating and revealing to participants',
    paragraphs: 2
  },
  {
    id: 'doing-mode',
    title: 'Doing mode',
    chapterId: 5,
    startPhrase: 'An essential premise of MBCT is that the mind has two broad modes',
    paragraphs: 2
  },
  {
    id: 'being-mode',
    title: 'Being mode',
    chapterId: 9,
    startPhrase: 'As described in Point 5, a central premise of MBCT is that the mind operates in different modes',
    paragraphs: 1
  },
  {
    id: 'rumination',
    title: 'The trap of rumination',
    chapterId: 6,
    startPhrase: 'Rumination is an attempt to address difficult emotions through a process of analysis and problem solving',
    paragraphs: 1
  },
  {
    id: 'avoidance',
    title: 'Experiential avoidance',
    chapterId: 7,
    startPhrase: 'A crucial part of our natural survival processes is our aversive reaction to unpleasant feelings',
    paragraphs: 1
  },
  {
    id: 'acceptance',
    title: 'Acceptance',
    chapterId: 11,
    startPhrase: 'Acceptance can be confused with resignation and giving up',
    paragraphs: 2
  },
  {
    id: 'decentring',
    title: 'Thoughts are not facts',
    chapterId: 12,
    startPhrase: 'At the heart of mindfulness practice is a paradox',
    paragraphs: 1
  },
  {
    id: 'body',
    title: 'The body as doorway',
    chapterId: 10,
    startPhrase: 'Training in mindfulness places a great deal of emphasis on learning to be with direct experience as it arises in the body',
    paragraphs: 2
  },
  {
    id: 'awareness',
    title: 'Awareness as container',
    chapterId: 13,
    startPhrase: 'It can feel tremendously reassuring to hear that awareness can contain any experience that emerges',
    paragraphs: 2
  },
];

/* ── The four key sentences that tell the MBCT story ── */
const NARRATIVE = [
  'Mindfulness is the awareness that emerges when we pay attention to experience in a particular way: on purpose, in the present moment, and nonjudgementally.',
  'Doing mode is primarily a conceptual, thought-based mode of processing experience: we are ‘thinking about’ rather than ‘being with’ our direct experience. The thoughts that are the ‘currency’ of this mode of mind become our reality.',
  'Rumination is an attempt to address difficult emotions through a process of analysis and problem solving. The interconnected relapse-related processes of ruminative thinking and experiential avoidance arise out of and are perpetuated by the activities of the doing mode of mind.',
  'The shift towards a more mindful mode of being, which involves both acceptance and paying attention to the actuality of the present moment, enables participants to access new ways to process or ‘be with’ depression-related and other aspects of experience.',
];

/* ── Five concrete steps for difficult moments ── */
const ACTION_STEPS = [
  {
    title: 'Notice you’re in doing mode',
    quote: 'A key intention of the programme is to enable participants to recognise the mode of mind that they are in, and to be able to intentionally shift from one mode to another.',
    teachingId: 'automatic-pilot'
  },
  {
    title: 'Shift — use the body or breath',
    quote: 'The ability to “wake up” while in the midst of things in daily life can take the form of a momentary sense of awareness of the sensations of the feet on the floor or of the breath. In that moment, instead of being caught up with whatever mind state predominates we change perspective.',
    teachingId: 'being-mode'
  },
  {
    title: 'Turn towards, not away',
    quote: 'We are learning to be present with and acceptant of pleasant, unpleasant and neutral experience—developing an even-handedness towards our experience. We learn to be tender, gentle, kindly, compassionate and respectful towards ourselves and our experience.',
    teachingId: 'acceptance'
  },
  {
    title: 'Let thoughts be thoughts',
    quote: 'The invitation is to designate another focus of attention such as the breath to anchor the attention into the present moment. We note the thoughts as they arise, and then let go of them, returning to the primary focus of attention on the breath. This is done with a sense of kindliness and gentleness but also with persistence and firmness.',
    teachingId: 'decentring'
  },
  {
    title: 'Rest in awareness',
    quote: 'The awareness of our experience is not the experience itself: the awareness of depression is not depressed; the awareness of pain is not itself in pain. We are able to be with this experience, see around it and see it in a wider context.',
    teachingId: 'awareness'
  },
];

/* ═══ THEME ═══ */
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
let isDark = localStorage.getItem('theme') === 'dark' ||
             (!localStorage.getItem('theme') && prefersDark.matches);

function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-meta').content = isDark ? '#1c1917' : '#4a7060';
  const icon = document.getElementById('theme-icon');
  icon.innerHTML = isDark
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" stroke="none"/>'
    : `<circle cx="12" cy="12" r="4"/>
       <line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/>
       <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
       <line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/>
       <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>`;
}

function toggleTheme() {
  isDark = !isDark;

}

/* ═══ TEXT UTILITIES ═══ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderParas(text) {
  const paras = text.split('\n\n');
  let html = '';
  for (const raw of paras) {
    const trimmed = raw.trim();
    if (!trimmed) continue;
    const lines = trimmed.split('\n').map(l => l.trim()).filter(Boolean);
    const joined = lines.join(' ');

    // Bullet list
    if (raw.includes('\n·') || raw.startsWith('·')) {
      const items = raw.split(/\n?·/).filter(s => s.trim());
      html += '<ul>' + items.map(s => `<li>${escHtml(s.replace(/\n/g,' ').trim())}</li>`).join('') + '</ul>';
      continue;
    }

    // Footnote or parenthetical citation — digit-started, or publisher reference
    const isFootnote = /^\d+\s+[A-Za-z]/.test(joined) ||
      (joined.length < 120 && /^\(/.test(joined)) ||
      /Holistic Health|Hyperion|Davis Company|Flamingo|Plume|Routledge/.test(joined);
    if (isFootnote) {
      html += `<p class="footnote-line">${escHtml(joined)}</p>`;
      continue;
    }

    // Paragraph with an inline section heading on the first line
    // (first line: short, no sentence-ending punct, starts with capital; body follows)
    const firstLine = lines[0];
    const bodyLines = lines.slice(1);
    const firstLineIsHeading = firstLine.length < 80 &&
      !/[.!?]$/.test(firstLine) && /^[A-Z"']/.test(firstLine) &&
      !/^[·\d]/.test(firstLine) && bodyLines.length >= 1 &&
      bodyLines.join(' ').length > 40;
    if (firstLineIsHeading) {
      html += `<h3>${escHtml(firstLine)}</h3><p>${escHtml(bodyLines.join(' '))}</p>`;
      continue;
    }

    // Standalone section heading
    const isHeader = joined.length < 90 && lines.length <= 2 &&
      !/[.!?)]$/.test(joined) && /^[A-Z"']/.test(joined) &&
      !/^[·\d]/.test(joined[0]);
    if (isHeader) { html += `<h3>${escHtml(joined)}</h3>`; continue; }

    html += `<p>${escHtml(joined)}</p>`;
  }
  return html;
}

/* ═══ SENTENCE LIST RENDERER ═══ */
function sentenceSplit(flat) {
  // Split at [.!?] followed by space+capital — but not at single-letter abbreviations (M., A., F.)
  const raw = [];
  let rem = flat.trim();
  while (rem.length > 5) {
    // Negative lookbehind: don't break after a lone capital or lowercase letter preceded by space
    // This prevents splitting "M. A." or "F. A." or "p. 105"
    const m = rem.match(/^(.+?(?<!\s[A-Za-z])[.!?])(?=\s+[A-Z"'(]|\s*$)/);
    if (!m || m[1].length > rem.length * 0.92) {
      if (rem.length > 5) raw.push(rem);
      break;
    }
    raw.push(m[1].trim());
    rem = rem.slice(m[1].length).trim();
  }
  // Merge fragments shorter than 20 chars back with previous sentence
  const merged = [];
  for (const s of raw) {
    if (s.length < 20 && merged.length > 0 && !/[!?]$/.test(s)) {
      merged[merged.length - 1] += ' ' + s;
    } else {
      merged.push(s);
    }
  }
  return merged.filter(s => s.length > 10);
}

function isJunk(s) {
  if (s.length < 14 && !/[!?]$/.test(s)) return true;
  if (/Holistic Health|Hyperion|Davis Company|Flamingo|Plume|Routledge/.test(s)) return true;
  if (/^\d+\s+[A-Z][a-z]+,?\s+\d{4}/.test(s)) return true; // footnote "4 From..."
  return false;
}

function renderSentenceList(text, sectionLabel) {
  if (!text || !text.trim()) return '';
  const paras = text.split('\n\n').filter(p => p.trim());
  let items = [];

  if (sectionLabel) items.push({ type: 'label', text: sectionLabel });

  for (const para of paras) {
    const flat = para.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
    if (!flat || flat.length < 10) continue;

    // Skip footnote lines (digit + text, or reference-like)
    if (/^\d+\s[A-Z]/.test(flat) && flat.length < 200) continue;

    // Detect inline section heading (first line short + no sentence punct + remaining body)
    const rawLines = para.split('\n').map(l => l.trim()).filter(Boolean);
    if (rawLines.length >= 2) {
      const fst = rawLines[0];
      if (fst.length < 80 && !/[.!?]$/.test(fst) && /^[A-Z"']/.test(fst)) {
        items.push({ type: 'label', text: fst });
        const body = rawLines.slice(1).join(' ');
        sentenceSplit(body).filter(s => !isJunk(s)).forEach(s => items.push({ type: 'item', text: s }));
        continue;
      }
    }

    // Standalone short heading
    if (flat.length < 90 && !/[.!?]$/.test(flat) && /^[A-Z"']/.test(flat) && !/^[·\d]/.test(flat)) {
      items.push({ type: 'label', text: flat });
      continue;
    }

    // Regular paragraph → split into sentences, skip junk
    sentenceSplit(flat).filter(s => !isJunk(s)).forEach(s => items.push({ type: 'item', text: s }));
  }

  if (!items.length) return '';
  // Returns inner HTML without container — callers wrap in <div class="insight-list">
  return items.map(item =>
    item.type === 'label'
      ? `<div class="insight-section-label">${escHtml(item.text)}</div>`
      : `<div class="insight-item">${escHtml(item.text)}</div>`
  ).join('');
}

/* ═══ PASSAGE SPLIT ═══ */
function splitPassage(keyText) {
  // Extracts the first complete sentence from a passage block.
  // Returns { quote: string, rest: string } keeping paragraph structure in rest.
  const paras = keyText.split('\n\n').filter(p => p.trim());
  const first = paras[0].replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
  // Match first sentence: ends at [.!?] followed by space+capital or end
  const m = first.match(/^(.+?[.!?])(?=\s+[A-Z"'(]|\s*$)/);
  if (!m || m[1].length > first.length * 0.88) {
    return { quote: first, rest: paras.slice(1).join('\n\n') };
  }
  let quote = m[1].trim();
  // Strip trailing inline citation e.g. "(Kabat-Zinn, 1994)"
  quote = quote.replace(/\s*\([A-Za-z][^)]+\d{4}[^)]*\)\.$/, '.').replace(/\s*\([A-Za-z][^)]+\d{4}[^)]*\)$/, '').trim();
  if (!/[.!?]$/.test(quote)) quote += '.';
  const firstRest = first.slice(m[1].length).trim();
  const rest = [firstRest, ...paras.slice(1)].filter(Boolean).join('\n\n');
  return { quote, rest };
}

/* ═══ PASSAGE EXTRACTION ═══ */
function extractPassage(chapterId, startPhrase, count) {
  const ch = CHAPTERS.find(c => c.id === chapterId);
  if (!ch) return { key: '', more: '' };
  const paras = ch.body.split('\n\n').filter(p => p.trim());

  // Normalize newlines to spaces for searching (PDF text has hard-wrapped lines)
  const phraseLower = startPhrase.toLowerCase();
  let idx = paras.findIndex(p => p.toLowerCase().replace(/\n/g,' ').includes(phraseLower));
  if (idx === -1) idx = 0;

  // Trim the starting paragraph to begin exactly at the phrase
  let firstPara = paras[idx];
  const norm = firstPara.toLowerCase().replace(/\n/g,' ');
  const phrasePos = norm.indexOf(phraseLower);
  if (phrasePos > 0) firstPara = firstPara.slice(phrasePos);

  const all = [firstPara, ...paras.slice(idx + 1)];
  return {
    key: all.slice(0, count).join('\n\n'),
    more: all.slice(count, count + 5).join('\n\n')
  };
}

  navStack.pop();

  if (prev === 'toc') { renderHome(); return; }
  if (prev.startsWith('teaching:')) { showTeaching(prev.split(':')[1], false); return; }
  if (prev.startsWith('chapter:')) { showChapter(parseInt(prev.split(':')[1]), false); return; }
}

  document.getElementById('btn-back').classList.remove('visible');

/* ═══ CHAPTER SUMMARY UTILS ═══ */

// Fix PDF artifact: bullet markers on separate lines from their text.
// Merges consecutive bullet-only paragraphs with the N text paragraphs that follow.
function fixSplitBullets(text) {
  const paras = text.split('\n\n');
  const result = [];
  let i = 0;
  while (i < paras.length) {
    const lines = paras[i].split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length > 0 && lines.every(l => l === '·')) {
      // Merge consecutive bullet-only paragraphs
      let totalBullets = lines.length;
      let j = i + 1;
      while (j < paras.length) {
        const nl = paras[j].split('\n').map(l => l.trim()).filter(Boolean);
        if (nl.length > 0 && nl.every(l => l === '·')) { totalBullets += nl.length; j++; }
        else break;
      }
      // Pair with the next totalBullets text paragraphs
      const items = [];
      for (let k = 0; k < totalBullets && j + k < paras.length; k++) {
        items.push('· ' + paras[j + k].replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
      }
      if (items.length) { result.push(items.join('\n')); i = j + items.length; continue; }
    }
    result.push(paras[i]);
    i++;
  }
  return result.join('\n\n');
}

function extractSummary(ch) {
  const idx = ch.body.lastIndexOf('Summary\n');
  if (idx < 0) return null;
  return ch.body.slice(idx + 'Summary\n'.length).trim();
}

function renderFeatureSummary(raw) {
  const paras = fixSplitBullets(raw).split('\n\n').filter(p => p.trim());
  let html = '';
  for (const p of paras) {
    const flat = p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
    if (!flat || flat.length < 10) continue;
    // Skip bullet-only residue
    if (/^[·\s]+$/.test(flat)) continue;
    // Bullet list paragraph
    if (flat.startsWith('·')) {
      const items = flat.split(/\s*·\s*/).filter(s => s.trim());
      html += '<ul>' + items.map(s => `<li>${escHtml(s.trim())}</li>`).join('') + '</ul>';
      continue;
    }
    html += `<p>${escHtml(flat)}</p>`;
  }
  return html;
}

/* ═══ CHAPTER CARDS (TOC) ═══ */
function renderFeatureCards() {
  const p1 = document.getElementById('part1-section');
  const p2 = document.getElementById('part2-section');
  CHAPTERS.forEach(ch => {
    const card = document.createElement('div');
    card.className = `feature-card part-${ch.part}`;
    card.setAttribute('role', 'button'); card.setAttribute('tabindex', '0');
    card.onclick = () => showChapter(ch.id);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') showChapter(ch.id); };

    const rawSummary = extractSummary(ch);
    const summaryHtml = rawSummary
      ? renderFeatureSummary(rawSummary)
      : `<p>${escHtml(ch.preview.replace(/^\s*\d{1,2}\s*\)\s*/, '').replace(/\n/g, ' ').trim().slice(0, 220))}</p>`;

    card.innerHTML = `
      <div class="feature-card-header">
        <div class="feature-num">${ch.id}</div>
        <div class="feature-title">${escHtml(ch.title)}</div>
        <svg class="card-arrow" width="7" height="12" viewBox="0 0 7 12" fill="none">
          <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="feature-summary">${summaryHtml}</div>`;
    (ch.part === 1 ? p1 : p2).appendChild(card);
  });
}

/* ═══ SHOW TEACHING ═══ */
function showTeaching(id, push = true) {
  const t = KEY_TEACHINGS.find(x => x.id === id);
  if (!t) return;
  const ch = CHAPTERS.find(c => c.id === t.chapterId);
  if (!ch) return;

  if (push) navStack.push(`teaching:${id}`);
  currentTeachingChapterId = t.chapterId;
  expanded = false;

  document.getElementById('btn-back').classList.add('visible');
  document.getElementById('back-label').textContent = navStack.length > 2 ? 'Back' : 'Home';
  document.getElementById('header-title').textContent = t.title;

  document.getElementById('teaching-source-label').textContent = `Chapter ${t.chapterId}`;
  document.getElementById('teaching-hero-title').textContent = t.title;
  document.getElementById('full-chapter-link-title').textContent = ch.title;

  const { key, more } = extractPassage(t.chapterId, t.startPhrase, t.paragraphs);
  const { quote, rest } = splitPassage(key);

  document.getElementById('pull-quote').textContent = quote;

  // Level 1: up to 4 clean sentences from the passage body
  const restSentences = rest.split('\n\n').filter(p => p.trim())
    .flatMap(p => sentenceSplit(p.replace(/\n/g,' ').replace(/\s+/g,' ').trim()).filter(s => !isJunk(s)));
  const bodyItems = restSentences.slice(0, 4);
  const overflowItems = restSentences.slice(4);

  document.getElementById('teaching-passage').innerHTML = bodyItems.length
    ? '<div class="insight-list">' + bodyItems.map(s => `<div class="insight-item">${escHtml(s)}</div>`).join('') + '</div>'
    : '';

  // Level 2: overflow sentences + more paragraphs, all in one insight-list
  const moreEl = document.getElementById('teaching-more');
  const moreInner = [
    ...overflowItems.map(s => `<div class="insight-item">${escHtml(s)}</div>`),
    more.trim() ? `<div class="insight-section-label">More from the chapter</div>${renderSentenceList(more)}` : ''
  ].join('');
  moreEl.innerHTML = moreInner ? `<div class="insight-list">${moreInner}</div>` : '';
  moreEl.classList.remove('open');
  document.getElementById('expand-btn').textContent = 'Read more';

  showView('view-teaching');
  document.getElementById('view-teaching').scrollTop = 0;
}

function toggleExpand() {
  expanded = !expanded;
  document.getElementById('teaching-more').classList.toggle('open', expanded);
  document.getElementById('expand-btn').textContent = expanded ? 'Show less' : 'Read more';
}

function goToChapterFromTeaching() {
  if (currentTeachingChapterId) showChapter(currentTeachingChapterId);
}

/* ═══ SHOW CHAPTER ═══ */
function showChapter(id, push = true) {
  const ch = CHAPTERS.find(c => c.id === id);
  if (!ch) return;

  if (push) navStack.push(`chapter:${id}`);
  document.getElementById('btn-back').classList.add('visible');
  document.getElementById('back-label').textContent = navStack.length > 2 ? 'Back' : 'Home';
  document.getElementById('header-title').textContent = `Chapter ${ch.id}`;

  const tag = document.getElementById('chapter-tag');
  tag.textContent = ch.part === 1 ? 'Theory' : 'Practice';
  tag.className = 'chapter-part-tag ' + (ch.part === 1 ? 'theory' : 'practice');
  document.getElementById('chapter-title').textContent = ch.title;

  // Strip title text from body start then render
  let body = ch.body;
  const titleAlpha = ch.title.toLowerCase().replace(/[^a-z]/g,'');
  const bodyAlpha  = body.toLowerCase().replace(/[^a-z]/g,'');
  if (bodyAlpha.startsWith(titleAlpha.slice(0, Math.min(20, titleAlpha.length)))) {
    let matched = 0, i = 0;
    for (; i < body.length && matched < titleAlpha.length; i++) {
      if (/[a-zA-Z]/.test(body[i])) matched++;
    }
    body = body.slice(i).trim();
  }
  document.getElementById('chapter-body').innerHTML = renderParas(fixSplitBullets(body));

  showView('view-chapter');
  const cv = document.getElementById('view-chapter');
  cv.scrollTop = 0;
  cv.onscroll = () => {
    const p = cv.scrollTop / (cv.scrollHeight - cv.clientHeight) || 0;
    document.getElementById('reading-progress').style.transform = `scaleX(${p})`;
  };
}

/* ═══ BROWSER BACK ═══ */
window.addEventListener('popstate', e => {
  if (navStack.length > 1) goBack();
  else renderHome();
});

/* ═══ INIT ═══ */
renderHomeContent();
renderFeatureCards();
renderHome();

// Handle direct URL hash
const m = location.hash.match(/^#feature-(\d+)$/);
if (m) showChapter(parseInt(m[1]));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
